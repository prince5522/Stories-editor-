
name: Build Stories Editor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Prepare Android web files
        run: |
          mkdir -p www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            ./ www/

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Apply Stories Editor launcher icon
        run: |
          set -e

          for item in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $item
            density=$1
            size=$2

            mkdir -p "android/app/src/main/res/mipmap-$density"

            convert icon-512.png -resize "${size}x${size}" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"

            convert icon-512.png -resize "${size}x${size}" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"

            convert icon-512.png -resize "${size}x${size}" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stories-Editor-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
